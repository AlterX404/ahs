<html lang="en">
<head>

  <link

    rel="stylesheet"
  />

  <style>
    :root {
      --background: #050505;
      --background-soft: #090909;
      --panel: #111111;
      --panel-hover: #151515;

      --primary-red: #b10808;
      --primary-red-light: #d11313;
      --primary-red-dark: #720404;

      --text: #f5f5f5;
      --muted: #929292;

      --border: rgba(255, 255, 255, 0.08);
      --red-border: rgba(177, 8, 8, 0.48);

      --container: 780px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(
          circle at 50% 18%,
          rgba(177, 8, 8, 0.13),
          transparent 32%
        ),
        var(--background);
      font-family: "Inter", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(
          rgba(255, 255, 255, 0.012) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.012) 1px,
          transparent 1px
        );
      background-size: 48px 48px;
      mask-image:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.65),
          transparent 72%
        );
    }

    button,
    a {
      font: inherit;
    }

    button {
      border: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* HEADER */

    .site-header {
      width: 100%;
      min-height: 78px;
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(5, 5, 5, 0.88);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .header-inner {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: white;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -1.1px;
    }

    .brand > span > span {
      color: var(--primary-red-light);
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      color: white;
      background:
        linear-gradient(
          145deg,
          var(--primary-red-light),
          var(--primary-red-dark)
        );
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 11px;
      box-shadow:
        0 8px 24px rgba(177, 8, 8, 0.23),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .brand-icon svg {
      width: 21px;
      height: 21px;
      fill: currentColor;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      transition:
        color 0.2s ease,
        transform 0.2s ease;
    }

    .back-link:hover {
      color: white;
      transform: translateX(-3px);
    }

    /* PAGE */

    .page {
      padding: 58px 20px 80px;
    }

    .unlock-container {
      width: min(var(--container), 100%);
      margin: 0 auto;
    }

    .page-heading {
      margin-bottom: 38px;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      padding: 9px 20px;
      color: var(--primary-red-light);
      background: rgba(177, 8, 8, 0.09);
      border: 1px solid rgba(177, 8, 8, 0.22);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .page-heading h1 {
      margin-bottom: 14px;
      color: white;
      font-size: clamp(36px, 6vw, 54px);
      font-weight: 900;
      letter-spacing: -2.4px;
      line-height: 1.03;
    }

    .page-heading h1 span {
      color: var(--primary-red-light);
    }

    .page-heading p {
      max-width: 600px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.75;
    }

    /* TASKS */

    .tasks {
      display: grid;
      gap: 13px;
    }

    .task {
      width: 100%;
      min-height: 76px;
      display: grid;
      grid-template-columns: 54px 1fr 42px;
      align-items: center;
      gap: 12px;
      padding: 11px 18px;
      position: relative;
      overflow: hidden;
      color: white;
      text-align: left;
      cursor: pointer;
      background:
        linear-gradient(
          110deg,
          var(--primary-red-dark),
          var(--primary-red)
        );
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 15px;
      box-shadow:
        0 12px 28px rgba(177, 8, 8, 0.13),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;
    }

    .task::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          115deg,
          transparent 20%,
          rgba(255, 255, 255, 0.07) 48%,
          transparent 75%
        );
      transform: translateX(-120%);
      transition: transform 0.55s ease;
    }

    .task:hover::before {
      transform: translateX(120%);
    }

    .task:hover:not(:disabled) {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow:
        0 18px 36px rgba(177, 8, 8, 0.21),
        inset 0 1px 0 rgba(255, 255, 255, 0.11);
    }

    .task:active:not(:disabled) {
      transform: translateY(0) scale(0.992);
    }

    .task:disabled {
      cursor: default;
    }

    .task-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      position: relative;
      z-index: 1;
      background: rgba(0, 0, 0, 0.23);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 11px;
    }

    .task-icon svg {
      width: 23px;
      height: 23px;
      fill: currentColor;
    }

    .task-text {
      min-width: 0;
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .task-title {
      display: block;
      margin-bottom: 4px;
      color: white;
      font-size: 15px;
      font-weight: 800;
    }

    .task-status {
      display: block;
      color: rgba(255, 255, 255, 0.64);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    .task-arrow {
      display: grid;
      place-items: center;
      position: relative;
      z-index: 1;
      font-size: 24px;
      font-weight: 900;
      transition: transform 0.2s ease;
    }

    .task:hover:not(:disabled) .task-arrow {
      transform: translateX(4px);
    }

    /* WAITING STATE */

    .task.pending {
      background:
        linear-gradient(
          110deg,
          #330404,
          #6d0606
        );
      border-color: rgba(209, 19, 19, 0.35);
    }

    .task.pending::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: var(--wait-progress, 0%);
      height: 3px;
      background: var(--primary-red-light);
      box-shadow: 0 0 14px rgba(209, 19, 19, 0.7);
      transition: width 0.25s linear;
    }

    .task.pending .task-icon {
      animation: waitingPulse 1.1s ease-in-out infinite;
    }

    /* COMPLETED STATE */

    .task.complete {
      background:
        linear-gradient(
          110deg,
          #171717,
          #101010
        );
      border-color: var(--red-border);
      box-shadow:
        0 10px 26px rgba(0, 0, 0, 0.26),
        inset 3px 0 0 var(--primary-red);
    }

    .task.complete .task-icon {
      color: white;
      background: var(--primary-red-dark);
      border-color: rgba(209, 19, 19, 0.3);
    }

    .task.complete .task-status {
      color: var(--primary-red-light);
    }

    .task.complete .task-arrow {
      color: var(--primary-red-light);
    }

    @keyframes waitingPulse {
      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(0.92);
        opacity: 0.65;
      }
    }

    /* PROGRESS */

    .progress-section {
      margin-top: 32px;
      text-align: center;
    }

    .progress-label {
      margin-bottom: 11px;
      color: white;
      font-size: 13px;
      font-weight: 700;
    }

    .progress-track {
      width: 76%;
      height: 8px;
      margin: 0 auto;
      overflow: hidden;
      background: #1c1c1c;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 999px;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background:
        linear-gradient(
          90deg,
          var(--primary-red-dark),
          var(--primary-red-light)
        );
      border-radius: inherit;
      box-shadow: 0 0 14px rgba(209, 19, 19, 0.5);
      transition: width 0.45s ease;
    }

    /* FINAL BUTTON */

    .final-button {
      width: 100%;
      min-height: 72px;
      display: grid;
      grid-template-columns: 48px 1fr 38px;
      align-items: center;
      gap: 12px;
      margin-top: 26px;
      padding: 11px 18px;
      color: #717171;
      cursor: not-allowed;
      background:
        linear-gradient(
          110deg,
          #111111,
          #181818
        );
      border: 1px solid var(--border);
      border-radius: 15px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.24);
      opacity: 0.72;
      transition:
        opacity 0.25s ease,
        transform 0.25s ease,
        box-shadow 0.25s ease,
        color 0.25s ease,
        background 0.25s ease,
        border-color 0.25s ease;
    }

    .final-button.unlocked {
      color: white;
      cursor: pointer;
      opacity: 1;
      background:
        linear-gradient(
          110deg,
          var(--primary-red-dark),
          var(--primary-red-light)
        );
      border-color: rgba(209, 19, 19, 0.54);
      box-shadow:
        0 16px 36px rgba(177, 8, 8, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .final-button.unlocked:hover {
      transform: translateY(-3px);
      box-shadow:
        0 21px 42px rgba(177, 8, 8, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .final-icon {
      display: grid;
      place-items: center;
    }

    .final-icon svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .final-text {
      text-align: center;
      font-size: 16px;
      font-weight: 800;
    }

    .final-arrow {
      font-size: 24px;
      font-weight: 900;
    }

    /* INFORMATION */

    .information {
      margin-top: 22px;
      padding: 18px 20px;
      color: var(--muted);
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      font-size: 11px;
      line-height: 1.75;
    }

    .information strong {
      color: #d8d8d8;
    }

    .reset-button {
      margin-top: 14px;
      color: #747474;
      cursor: pointer;
      background: transparent;
      border: none;
      font-size: 11px;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 4px;
      transition: color 0.2s ease;
    }

    .reset-button:hover {
      color: var(--primary-red-light);
    }

    /* TOAST */

    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 200;
      max-width: min(350px, calc(100% - 44px));
      padding: 14px 18px;
      color: white;
      pointer-events: none;
      background: #121212;
      border: 1px solid var(--red-border);
      border-radius: 12px;
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.48);
      opacity: 0;
      transform: translateY(15px);
      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .toast.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* MOBILE */

    @media (max-width: 650px) {
      .site-header {
        min-height: 70px;
      }

      .header-inner {
        width: min(100% - 26px, 1180px);
      }

      .brand {
        font-size: 21px;
      }

      .brand-icon {
        width: 36px;
        height: 36px;
      }

      .back-link span {
        display: none;
      }

      .page {
        padding: 42px 14px 60px;
      }

      .page-heading {
        margin-bottom: 29px;
      }

      .page-heading h1 {
        letter-spacing: -1.5px;
      }

      .page-heading p {
        font-size: 13px;
      }

      .task {
        min-height: 70px;
        grid-template-columns: 45px 1fr 29px;
        padding: 9px 12px;
        border-radius: 13px;
      }

      .task-icon {
        width: 39px;
        height: 39px;
      }

      .task-icon svg {
        width: 20px;
        height: 20px;
      }

      .task-title {
        font-size: 13px;
      }

      .task-status {
        font-size: 8px;
      }

      .progress-track {
        width: 91%;
      }

      .final-button {
        min-height: 67px;
        grid-template-columns: 39px 1fr 27px;
        padding: 9px 13px;
        border-radius: 13px;
      }

      .final-text {
        font-size: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
